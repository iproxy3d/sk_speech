[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sk-speech"
version = "0.1.0"
description = "Research toolkit for speech analysis, transformation, synthesis, filtering and voice modeling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "iproxy3d"}]
keywords = [
  "speech", "audio", "acoustics", "pitch", "formants", "vowels",
  "prosody", "noise-reduction", "signal-processing", "praat", "voice",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "audiostretchy>=1.3",
  "librosa>=0.10",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "praat-parselmouth>=0.4.3",
  "pydub>=0.25",
  "pygame>=2.5",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "soundfile>=0.12",
]

[project.optional-dependencies]
examples = [
  "hdbscan>=0.8.33",
  "pandas>=2.0",
  "pyworld>=0.3.4",
  "sounddevice>=0.4.6",
]
penn = ["penn>=1.0.0"]
rubberband = ["pyrubberband>=0.4.0"]
test = ["pytest>=7.4", "pytest-cov>=5.0"]
dev = ["build>=1.2", "pytest>=7.4", "pytest-cov>=5.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/iproxy3d/sk_speech"
Documentation = "https://github.com/iproxy3d/sk_speech/blob/main/docs/README.md"
Issues = "https://github.com/iproxy3d/sk_speech/issues"
Source = "https://github.com/iproxy3d/sk_speech"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sk_speech = ["py.typed", "data/**/*.json", "data/**/*.wav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["sk_speech"]

[tool.coverage.report]
show_missing = true
skip_covered = true

